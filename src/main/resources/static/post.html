<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GotEEgo 여행 게시판</title>
    <link rel="stylesheet" href="/css/post.css">
    <link rel="stylesheet" href="/css/notification.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/shared-websocket.js"></script>
    <script src="/js/common.js"></script>
</head>
<body>
<div class="container">
    <h1>✈️ GotEEgo 여행 게시판</h1>

    <div class="status">
        <div>
            <button onclick="logout()">로그아웃</button>
            <span id="login-status">로그인 상태 확인 중...</span>
            <button onclick="location.href='/'" style="margin-left: 10px; background-color: #28a745;">로그인</button>
        </div>
        <div>
            <button onclick="location.href='chat.html'" style="margin-right: 10px;">채팅으로 이동</button>
        </div>
    </div>

    <fieldset>
        <legend>✈️ 여행 게시판</legend>
        <div class="form-row">
            <div class="form-group">
                <label>게시글 타입:</label>
                <select id="postType-select" onchange="getTravelPosts()">
                    <option value="BEFORE">사전 여행 (BEFORE)</option>
                    <option value="NOW">현지 여행 (NOW)</option>
                </select>
            </div>
            <div class="form-group">
                <label>정렬 기준:</label>
                <select id="sort-select" onchange="getTravelPosts()">
                    <option value="recent">최신순</option>
                    <option value="view">조회순</option>
                </select>
            </div>
        </div>
        <button onclick="getTravelPosts()">게시글 목록 새로고침</button>

        <div style="margin-top: 20px;">
            <h4>📝 새 게시글 작성 (사전 여행)</h4>
            <form id="createTravelPostForm" onsubmit="createTravelPost(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>제목:</label>
                        <input placeholder="제목" id="tp-title" required>
                    </div>
                    <div class="form-group">
                        <label>지역:</label>
                        <select id="tp-location" required>
                            <option value="JEJU">제주</option>
                            <option value="SEOUL">서울</option>
                            <option value="BUSAN">부산</option>
                            <option value="DAEGU">대구</option>
                            <option value="DAEJEON">대전</option>
                            <option value="JEONJU">전주</option>
                            <option value="GWANGJU">광주</option>
                            <option value="GYEONGJU">경주</option>
                            <option value="GANGNEUNG">강릉</option>
                            <option value="SOKCHO">속초</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>내용:</label>
                    <textarea placeholder="내용" id="tp-content" required style="width: 100%; height: 80px; resize: vertical;"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>시작 날짜:</label>
                        <input type="date" id="tp-start" required>
                    </div>
                    <div class="form-group">
                        <label>종료 날짜:</label>
                        <input type="date" id="tp-end" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>모집 인원:</label>
                        <input type="number" id="tp-limit" placeholder="인원" required min="1" value="4" style="width:100px;">
                    </div>
                    <div class="form-group">
                        <label>이미지 파일:</label>
                        <input type="file" id="tp-img" accept="image/*">
                    </div>
                </div>
                <button type="submit">게시글 작성</button>
            </form>
        </div>
        <div id="travel-result"></div>
    </fieldset>

    <fieldset>
        <legend>📅 내 일정 관리</legend>
        <button onclick="loadScheduleData()">내 일정 새로고침</button>

        <div class="schedule-container">
            <div class="schedule-left">
                <h3>📋 내 일정 목록</h3>
                <div id="schedule-list"></div>
            </div>
            <div class="schedule-right">
                <h3>👥 신청자/참여자 관리</h3>
                <div id="participant-management"></div>
            </div>
        </div>
    </fieldset>

    <div class="notification-container" id="notificationContainer"></div>
</div>

<script>

    // 페이지 로드 시 초기화
    window.onload = async function() {
        try {
            await apiClient.get('/api/users/me'); // 로그인 상태 확인
            document.getElementById('login-status').textContent = '로그인됨';

            await window.wsManager.connect();
            console.log("WebSocket이 성공적으로 연결되었습니다.");

            getTravelPosts();
            loadScheduleData();

        } catch (error) {
            console.error('로그인되어 있지 않거나 세션이 만료되었습니다.', error);
            document.getElementById('login-status').textContent = '로그인 필요';
            document.getElementById('travel-result').innerHTML = `<div class="error-message"><h3>⚠️ 로그인이 필요합니다</h3></div>`;
        }

        // 날짜 기본값 설정
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('tp-start').value = today;
        document.getElementById('tp-end').value = today;
    };

    // ===== 여행 게시판 API 함수들 =====

    async function getTravelPosts() {
        const postType = document.getElementById('postType-select').value;
        const sort = document.getElementById('sort-select').value;
        const resultDiv = document.getElementById('travel-result');
        resultDiv.innerHTML = '<div class="loader">게시글 목록을 불러오는 중...</div>';

        try {
            const res = await apiClient.get(`/api/travel-posts`, {
                params: { postType, page: 0, size: 10, sort }
            });

            // ✅ 수정된 부분: 응답 데이터의 키를 'beforePosts'와 'nowPosts'로 바로잡았습니다.
            const responseData = res.data;
            const posts = responseData.beforePosts || responseData.nowPosts || [];
            displayTravelPosts(posts, postType); // postType을 함께 넘겨줍니다.

        } catch(e) {
            console.error('게시글 목록 조회 실패:', e);
            resultDiv.innerHTML = `<div class="error-message">❌ 게시글 목록 조회 실패: ${e.response?.data?.message || e.message}</div>`;
        }
    }

    function displayTravelPosts(posts, postType) {
        const container = document.getElementById('travel-result');
        container.innerHTML = '';
        if (!posts || posts.length === 0) {
            container.innerHTML = '<div class="success-message">📝 등록된 게시글이 없습니다.</div>';
            return;
        }

        posts.forEach(post => {
            const div = document.createElement('div');
            div.className = 'schedule-item';

            // ✅ 수정된 부분: API 응답에 맞춰 필드명을 모두 수정했습니다.
            const isRecruiting = post.participants < post.maxParticipants;
            const postTypeBadge = postType === 'BEFORE' ? '<span class="status-badge status-before">사전여행</span>' : '<span class="status-badge status-now">현지여행</span>';
            const recruitmentBadge = isRecruiting ? '<span class="status-badge status-recruiting">모집중</span>' : '<span class="status-badge status-completed">모집완료</span>';
            const participantsText = postType === 'BEFORE' ? `<p><strong>참가자:</strong> ${post.participants || 0} / ${post.maxParticipants || 'N/A'}명</p>` : '';

            div.innerHTML = `
            <h4>${post.title || '제목 없음'}</h4>
            <p><strong>작성자:</strong> ${post.author?.nickname || 'N/A'}</p>
            <p><strong>지역:</strong> ${post.location || 'N/A'}</p>
            ${postType === 'BEFORE' ? `<p><strong>기간:</strong> ${post.startTime || 'N/A'} ~ ${post.endTime || 'N/A'}</p>` : ''}
            <p><strong>타입:</strong> ${postTypeBadge}</p>
            <p><strong>모집상태:</strong> ${recruitmentBadge}</p>
            ${participantsText}
            <p><strong>조회수:</strong> ${post.viewCount || 0}</p>
            <div class="action-buttons">
                <button onclick="joinTravelPost(${post.travelPostId})" class="approve">참여 신청</button>
                <button onclick="getTravelPostDetail(${post.travelPostId})" class="test">상세 보기</button>
                <button onclick="deleteTravelPost(${post.travelPostId})" class="reject">삭제</button>
            </div>`;
            container.appendChild(div);
        });
    }

    async function getTravelPostDetail(postId) {
        const resultDiv = document.getElementById('travel-result');
        try {
            const res = await apiClient.get(`/api/travel-posts/${postId}`);
            const post = res.data;
            const recruitmentBadge = post.addRecruit ? '<span class="status-badge status-recruiting">모집중</span>' : '<span class="status-badge status-completed">모집완료</span>';
            resultDiv.innerHTML = `
                <div class="schedule-item">
                    <h3>📋 게시글 상세 정보 (ID: ${post.id})</h3>
                    <h4>${post.title}</h4>
                    <p><strong>작성자:</strong> ${post.authorNickname}</p>
                    <p><strong>내용:</strong> ${post.content}</p>
                    <p><strong>기간:</strong> ${post.startTime} ~ ${post.endTime}</p>
                    <p><strong>모집인원:</strong> ${post.recruitLimit}명 (${recruitmentBadge})</p>
                    <p><strong>조회수:</strong> ${post.viewCount}</p>
                    <button onclick="getTravelPosts()">목록으로 돌아가기</button>
                </div>`;
        } catch(e) {
            resultDiv.innerHTML = `<div class="error-message">❌ 상세 정보 조회 실패: ${e.response?.data?.message || e.message}</div>`;
        }
    }

    async function createTravelPost(event) {
        event.preventDefault();

        // ✅ FormData 사용
        const formData = new FormData();
        formData.append('title', document.getElementById('tp-title').value);
        formData.append('content', document.getElementById('tp-content').value);
        formData.append('location', document.getElementById('tp-location').value);
        formData.append('startTime', document.getElementById('tp-start').value);
        formData.append('endTime', document.getElementById('tp-end').value);
        formData.append('recruitLimit', document.getElementById('tp-limit').value);
        formData.append('isAddRecruit', true);

        const imageFile = document.getElementById('tp-img').files[0];
        if (imageFile) {
            formData.append('image', imageFile);
        }

        // ✅ postType을 Query Param으로 전달
        const postType = "BEFORE";

        try {
            await apiClient.post(`/api/travel-posts?postType=${postType}`, formData, {
                headers: { 'Content-Type': 'multipart/form-data' }
            });
            alert('✅ 게시글이 성공적으로 작성되었습니다.');
            document.getElementById('createTravelPostForm').reset();
            getTravelPosts();
            loadScheduleData();
        } catch (e) {
            alert(`❌ 게시글 작성 실패: ${e.response?.data?.message || e.message}`);
        }
    }

    async function deleteTravelPost(postId) {
        if (!confirm(`정말로 이 게시글(ID: ${postId})을 삭제하시겠습니까?`)) return;
        try {
            await apiClient.delete(`/api/travel-posts/${postId}`);
            alert('게시글이 삭제되었습니다.');
            getTravelPosts();
        } catch (e) {
            alert(`❌ 삭제 실패: ${e.response?.data?.message || e.message}`);
        }
    }

    async function joinTravelPost(postId) {
        try {
            // ✅ 반환값이 없으므로 성공 여부만 확인
            await apiClient.post(`/api/travel-posts/${postId}/participations`);
            alert('✅ 참여 신청이 완료되었습니다. 작성자의 승인을 기다려주세요.');
            setTimeout(loadScheduleData, 1000); // 내 일정 목록 갱신
        } catch(e) {
            alert(`❌ 참여 신청 실패: ${e.response?.data?.message || e.message}`);
        }
    }

    // ===== 일정 관리 API 함수들 =====
    async function loadScheduleData() {
        try {
            const res = await apiClient.get('/api/schedule/mine');
            // ✅ API가 이제 페이징 객체가 아닌 리스트를 직접 반환
            displaySchedules(res.data);

            if (res.data && res.data.length > 0) {
                // 첫 번째 일정의 참여자 데이터를 자동으로 불러옴
                loadParticipantData(res.data[0].travelPostId);
            } else {
                document.getElementById('participant-management').innerHTML = '';
            }
        } catch(e) {
            console.error('일정 데이터 로드 실패:', e);
            document.getElementById('schedule-list').innerHTML = `<div class="error-message">❌ 일정 로드 실패</div>`;
        }
    }

    function displaySchedules(schedules) {
        const container = document.getElementById('schedule-list');
        container.innerHTML = '';
        if (!schedules || schedules.length === 0) {
            container.innerHTML = '<div>참여중인 일정이 없습니다.</div>';
            return;
        }

        schedules.forEach(schedule => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            div.innerHTML = `
                <h4>${schedule.title}</h4>
                <p><strong>작성자:</strong> ${schedule.authorNickname}</p>
                <p><strong>기간:</strong> ${schedule.startTime} ~ ${schedule.endTime}</p>
                <p><strong>참가자:</strong> ${schedule.approvedParticipantCount} / ${schedule.recruitLimit}명</p>
                <button onclick="loadParticipantData(${schedule.travelPostId})" class="approve">참여자 관리</button>`;
            container.appendChild(div);
        });
    }

    async function loadParticipantData(postId) {
        if (!postId) return;
        const container = document.getElementById('participant-management');
        container.innerHTML = `<div class="loader">참여자 목록 로딩 중... (게시글 ID: ${postId})</div>`;
        try {
            const [participantsRes, applicationsRes] = await Promise.all([
                apiClient.get(`/api/schedule/${postId}/participants`),
                apiClient.get(`/api/schedule/${postId}/applications`)
            ]);
            displayParticipantManagement(participantsRes.data, applicationsRes.data, postId);
        } catch (e) {
            console.error('참여자 데이터 로드 실패:', e);
            container.innerHTML = `<div class="error-message">❌ 참여자 정보 로드 실패</div>`;
        }
    }

    function displayParticipantManagement(participants, applications, postId) {
        const container = document.getElementById('participant-management');
        container.innerHTML = `<h4>게시글(ID: ${postId}) 참여자 관리</h4>`;

        const pendingApps = applications.filter(app => app.status === 'PENDING');
        if (pendingApps.length > 0) {
            const pendingDiv = document.createElement('div');
            pendingDiv.innerHTML = '<h5>⏳ 대기 중인 신청자</h5>';
            pendingApps.forEach(app => {
                const item = document.createElement('div');
                item.className = 'application-item';
                item.innerHTML = `
                    <p><strong>${app.participantNickname}</strong></p>
                    <div class="action-buttons">
                        <button onclick="updateParticipantStatus(${postId}, ${app.participantId}, 'APPROVED')" class="approve">승인</button>
                        <button onclick="updateParticipantStatus(${postId}, ${app.participantId}, 'REJECTED')" class="reject">거절</button>
                    </div>`;
                pendingDiv.appendChild(item);
            });
            container.appendChild(pendingDiv);
        }

        const approvedParts = participants.filter(p => p.status === 'APPROVED');
        if (approvedParts.length > 0) {
            const approvedDiv = document.createElement('div');
            approvedDiv.innerHTML = '<h5>✅ 승인된 참가자</h5>';
            approvedParts.forEach(p => {
                const item = document.createElement('div');
                item.className = 'participant-item';
                item.innerHTML = `<p><strong>${p.participantNickname}</strong></p>`;
                approvedDiv.appendChild(item);
            });
            container.appendChild(approvedDiv);
        }

        if(pendingApps.length === 0 && approvedParts.length === 0) {
            container.innerHTML += '<div>신청자 또는 참가자가 없습니다.</div>'
        }
    }

    async function updateParticipantStatus(postId, userId, status) {
        if (!confirm(`${status} 처리하시겠습니까?`)) return;
        try {
            // ✅ 요청 본문 형식 수정
            await apiClient.put(`/api/schedule/${postId}/participants/${userId}`, { status });
            alert(`${status} 처리가 완료되었습니다.`);
            loadParticipantData(postId); // UI 새로고침
        } catch (error) {
            alert(`상태 변경 실패: ${error.response?.data?.message || error.message}`);
        }
    }

</script>
</body>
</html>
