                            <option value="DAEJEON">대전</option>

                    <div class="form-group">

    function getAuthHeaders() {
        const accessToken = getCookie('accessToken');
        const headers = {
            'Content-Type': 'application/json'
        };
        
        if (accessToken) {
            headers['Authorization'] = `Bearer ${accessToken}`;
        }
        
        return headers;
    }

    // 쿠키에서 특정 값 가져오기
    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                return cookie.substring(name.length + 1);
            }
        }
        return null;
    }

    // 인증 체크 및 상태 표시
    window.onload = function() {
        const cookies = document.cookie.split(';');
        const accessToken = cookies.find(cookie => cookie.trim().startsWith('accessToken='));
        const isLoggedIn = accessToken ? true : false;
        document.getElementById('login-status').textContent = isLoggedIn ? '로그인됨' : '로그인 필요';

        // WebSocketManager 초기화 (알림 핸들러 등록)
        if (typeof initWebSocketManager === 'function') {
            initWebSocketManager(handleNotification);
        }

        // 페이지 로드 시 자동으로 일정 데이터 로드
        if (isLoggedIn) {
            loadScheduleData();
            getTravelPosts();
        } else {
            // 로그인 필요 안내
            document.getElementById('travel-result').innerHTML = `
                <div class="error-message">
                    <h3>⚠️ 로그인이 필요합니다</h3>
                    <p>게시글 작성과 조회를 위해서는 먼저 로그인해주세요.</p>
                    <p>Google 계정으로 로그인 후 다시 시도해주세요.</p>
                </div>
            `;
        }

        // 날짜 기본값 설정
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        document.getElementById('tp-start').value = today.toISOString().split('T')[0];
        document.getElementById('tp-end').value = tomorrow.toISOString().split('T')[0];
    };

    function handleNotification(notification) {
        const container = document.getElementById('notificationContainer') ||
            document.createElement('div');

        if (!document.getElementById('notificationContainer')) {
            container.id = 'notificationContainer';
            container.className = 'notification-container';
            document.body.appendChild(container);
        }

        const notiElement = document.createElement('div');
        notiElement.className = 'notification';
        notiElement.innerHTML = `
        <button class="notification-close" onclick="this.parentElement.remove()">×</button>
        <div class="notification-title">${notification.title}</div>
        <div class="notification-content">${notification.content}</div>
        <div class="notification-sender">From: ${notification.senderName}</div>
    `;

        container.appendChild(notiElement);

        // 5초 후 자동으로 사라지게 설정
        setTimeout(() => {
            notiElement.style.opacity = '0';
            setTimeout(() => notiElement.remove(), 300);
        }, 5000);
    }

        const postType = document.getElementById('test-postType').value;

        } catch(e) {

        }

    async function getTravelPosts(sortType) {
        // 정렬 타입이 전달되면 업데이트
        if (sortType) {
            currentSort = sortType;

            // 정렬 버튼 활성화 상태 업데이트
            document.querySelectorAll('.sort-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`sort-${sortType}`).classList.add('active');
        }

        const postType = document.getElementById('postType-select').value;
        const pageSize = document.getElementById('pageSize-input').value;

        try {
            const res = await axios.get(`/api/travel-posts?postType=${postType}&page=0&size=${pageSize}&sort=${currentSort}`, {
                headers: getAuthHeaders()
            });
            console.log('게시글 목록 API 응답:', res.data);
            displayTravelPosts(res.data, postType);
        } catch(e) {
            console.error('게시글 목록 조회 실패:', e);
            let errorMessage = '알 수 없는 오류가 발생했습니다.';

            if (e.response) {
                if (e.response.status === 401) {
                    errorMessage = '로그인이 필요합니다. Google 계정으로 로그인해주세요.';
                } else if (e.response.status === 403) {
                    errorMessage = '접근 권한이 없습니다.';
                } else if (e.response.data && e.response.data.message) {
                    errorMessage = e.response.data.message;
                } else {
                    errorMessage = `서버 오류 (${e.response.status}): ${e.message}`;
                }
            } else if (e.request) {
                errorMessage = '서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해주세요.';
            } else {
                errorMessage = e.message;
            }

            document.getElementById('travel-result').innerHTML = `<div class="error-message">❌ 에러: ${errorMessage}</div>`;
        }
    }

    function displayTravelPosts(responseData, postType) {
        const container = document.getElementById('travel-result');
        container.innerHTML = '';

        // 디버깅을 위한 응답 데이터 로그
        console.log('displayTravelPosts 호출됨');
        console.log('API 응답 데이터:', responseData);
        console.log('PostType:', postType);
        console.log('responseData 타입:', typeof responseData);
        console.log('responseData가 객체인가:', typeof responseData === 'object');
        console.log('responseData.data:', responseData?.data);

        // 새로운 API 응답 구조에 맞게 처리
        let posts = [];
        
        // 응답 데이터가 객체인지 배열인지 확인
        if (Array.isArray(responseData)) {
            // 직접 배열로 온 경우
            posts = responseData;
        } else if (responseData && typeof responseData === 'object') {
            // 서버 응답 구조에 맞게 data 필드 확인
            if (responseData.data && typeof responseData.data === 'object') {
                // data가 객체인 경우 (TravelPostResponseWrapper 구조)
                if (postType === 'BEFORE' && responseData.data.beforePosts) {
                    posts = responseData.data.beforePosts;
                    console.log('data.beforePosts에서 게시글 배열 추출:', posts);
                } else if (postType === 'NOW' && responseData.data.nowPosts) {
                    posts = responseData.data.nowPosts;
                    console.log('data.nowPosts에서 게시글 배열 추출:', posts);
                } else if (Array.isArray(responseData.data)) {
                    // data가 직접 배열인 경우
                    posts = responseData.data;
                    console.log('data 필드에서 게시글 배열 추출:', posts);
                } else {
                    posts = [];
                }
            } else if (postType === 'BEFORE' && responseData.beforePosts) {
                posts = responseData.beforePosts;
            } else if (postType === 'NOW' && responseData.nowPosts) {
                posts = responseData.nowPosts;
            } else if (responseData.content) {
                // PageResponseDto 구조
                posts = responseData.content;
            } else {
                // 기타 객체 구조
                posts = [];
            }
        } else {
            // 기타 경우
            posts = [];
        }

        console.log('처리된 posts:', posts);

        if (!posts || posts.length === 0) {
            container.innerHTML = '<div class="success-message">📝 등록된 게시글이 없습니다.</div>';
            return;
        }

        // posts가 배열인지 확인
        if (!Array.isArray(posts)) {
            console.error('posts가 배열이 아닙니다:', posts);
            container.innerHTML = '<div class="error-message">❌ 데이터 형식 오류: posts가 배열이 아닙니다.</div>';
            return;
        }

        posts.forEach((post, index) => {
            try {
                const div = document.createElement('div');
                div.className = 'schedule-item';
                
                const postTypeBadge = postType === 'BEFORE' ? 
                    '<span class="status-badge status-before">사전여행</span>' : 
                    '<span class="status-badge status-now">현지여행</span>';
                
                if (postType === 'BEFORE') {
                    // BEFORE 타입 응답 구조
                    const recruitmentBadge = post.participants >= post.maxParticipants ? 
                        '<span class="status-badge status-completed">모집완료</span>' : 
                        '<span class="status-badge status-recruiting">모집중</span>';
                    
                    div.innerHTML = `
                        <h4>${post.title || '제목 없음'}</h4>
                        <p><strong>작성자:</strong> ${post.author?.nickname || 'N/A'}</p>
                        <p><strong>기간:</strong> ${post.startTime || 'N/A'} ~ ${post.endTime || 'N/A'}</p>
                        <p><strong>타입:</strong> ${postTypeBadge}</p>
                        <p><strong>모집상태:</strong> ${recruitmentBadge}</p>
                        <p><strong>참가자:</strong> ${post.participants || 0}/${post.maxParticipants || 'N/A'}명</p>
                        <p><strong>조회수:</strong> ${post.viewCount || 0}</p>
                        <p><strong>유사도:</strong> ${post.similarity ? (post.similarity * 100).toFixed(1) + '%' : 'N/A'}</p>
                        <p><strong>지역:</strong> ${post.location || 'N/A'}</p>
                        <div class="action-buttons">
                            <button onclick="joinTravelPost(${post.travelPostId})" class="approve">
                                참여 신청
                            </button>
                            <button onclick="getTravelPostDetail(${post.travelPostId})" class="test">
                                상세 보기
                            </button>
                        </div>
                    `;
                } else {
                    // NOW 타입 응답 구조
                    div.innerHTML = `
                        <h4>${post.title || '제목 없음'}</h4>
                        <p><strong>작성자:</strong> ${post.author?.nickname || 'N/A'}</p>
                        <p><strong>타입:</strong> ${postTypeBadge}</p>
                        <p><strong>지역:</strong> ${post.location || 'N/A'}</p>
                        <p><strong>유사도:</strong> ${post.similarity ? (post.similarity * 100).toFixed(1) + '%' : 'N/A'}</p>
                        <div class="action-buttons">

    // ===== 일정관리 API =====
    async function loadScheduleData() {
        try {
            const scheduleRes = await axios.get('/api/schedule/mine?page=0&size=10', {headers: getAuthHeaders()});
            console.log('일정 API 응답:', scheduleRes.data);
            
            displaySchedules(scheduleRes.data);

            // 첫 번째 일정의 참여자 데이터 로드
            let scheduleData = scheduleRes.data;
            console.log('원본 scheduleData:', scheduleData);
            
            // 서버 응답 구조에 맞게 data 필드 추출
            if (scheduleData && typeof scheduleData === 'object' && scheduleData.data) {
                scheduleData = scheduleData.data;
                console.log('data 필드 추출 후:', scheduleData);
            }
            
            if (scheduleData && !Array.isArray(scheduleData)) {
                if (scheduleData.content && Array.isArray(scheduleData.content)) {
                    scheduleData = scheduleData.content;
                } else if (typeof scheduleData === 'object') {
                    scheduleData = [scheduleData];
                }
            }

            if (scheduleData && Array.isArray(scheduleData) && scheduleData.length > 0) {
                const firstSchedule = scheduleData[0];
                console.log('첫 번째 일정 데이터:', firstSchedule);
                
                // travelPostId 추출 시도
                const travelPostId = firstSchedule.travelPostId || firstSchedule.id || firstSchedule.travel_post_id;
                console.log('추출된 travelPostId:', travelPostId);
                
                if (travelPostId && travelPostId !== 'undefined') {
                    await loadParticipantData(travelPostId);
                } else {
                    console.warn('travelPostId를 찾을 수 없습니다:', firstSchedule);
                    document.getElementById('participant-management').innerHTML = 
                        '<div class="warning-message">⚠️ 참여자 데이터를 로드할 수 없습니다. travelPostId가 없습니다.</div>';
                }
            }
        } catch(e) {
            console.error('일정 데이터 로드 실패:', e);
            document.getElementById('schedule-result').innerHTML = `<div class="error-message">❌ 일정 데이터 로드 실패: ${e.response?.data?.message || e.message}</div>`;
        }
    }

    function displaySchedules(schedules) {
        const container = document.getElementById('schedule-list');
        container.innerHTML = '';

        // 디버깅을 위한 로그
        console.log('일정 데이터:', schedules);
        console.log('일정 데이터 타입:', typeof schedules);
        console.log('일정 데이터가 배열인가:', Array.isArray(schedules));

        // schedules가 배열이 아닌 경우 처리
        if (!schedules) {
            container.innerHTML = '<div class="success-message">📝 등록된 일정이 없습니다.</div>';
            return;
        }

        // schedules가 배열이 아닌 경우 배열로 변환 시도
        let scheduleArray = schedules;
        if (!Array.isArray(schedules)) {
            if (typeof schedules === 'object') {
                // 서버 응답 구조에 맞게 data 필드 확인
                if (schedules.data && Array.isArray(schedules.data)) {
                    scheduleArray = schedules.data;
                    console.log('data 필드에서 배열 추출:', scheduleArray);
                } else if (schedules.content && Array.isArray(schedules.content)) {
                    scheduleArray = schedules.content;
                } else {
                    // 단일 객체인 경우 배열로 변환
                    scheduleArray = [schedules];
                }
            } else {
                container.innerHTML = '<div class="error-message">❌ 일정 데이터 형식이 올바르지 않습니다.</div>';
                return;
            }
        }

        if (scheduleArray.length === 0) {
            container.innerHTML = '<div class="success-message">📝 등록된 일정이 없습니다.</div>';
            return;
        }

        scheduleArray.forEach(schedule => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            
            const postTypeBadge = '<span class="status-badge status-before">사전여행</span>'; // 일정은 BEFORE만
            
            const recruitmentBadge = schedule.participants >= schedule.maxParticipants ? 
                '<span class="status-badge status-completed">모집완료</span>' : 
                '<span class="status-badge status-recruiting">모집중</span>';
            
            div.innerHTML = `
                <h4>${schedule.title || '제목 없음'}</h4>
                <p><strong>작성자:</strong> ${schedule.author?.nickname || 'N/A'}</p>
                <p><strong>기간:</strong> ${schedule.startTime || 'N/A'} ~ ${schedule.endTime || 'N/A'}</p>
                <p><strong>타입:</strong> ${postTypeBadge}</p>
                <p><strong>모집상태:</strong> ${recruitmentBadge}</p>
                <p><strong>참가자:</strong> ${schedule.participants || 0}/${schedule.maxParticipants || 'N/A'}명</p>
                <p><strong>지역:</strong> ${schedule.location || 'N/A'}</p>
                <button onclick="loadParticipantData(${schedule.travelPostId || schedule.id || schedule.travel_post_id})" class="approve">
                    참여자 관리
                </button>
            `;
            container.appendChild(div);
        });
    }

    async function loadParticipantData(postId) {
        // postId 유효성 검사
        if (!postId || postId === 'undefined' || postId === 'null') {
            console.error('유효하지 않은 postId:', postId);
            document.getElementById('participant-management').innerHTML =
                '<div class="error-message">❌ 유효하지 않은 게시글 ID입니다.</div>';
            return;
        }

        console.log('참여자 데이터 로드 시작 - postId:', postId);
        
        try {
            const [participantsRes, applicationsRes] = await Promise.all([
                axios.get(`/api/schedule/${postId}/participants`, {headers: getAuthHeaders()}),
                axios.get(`/api/schedule/${postId}/applications`, {headers: getAuthHeaders()})
            ]);

            console.log('참여자 데이터 응답:', participantsRes.data);
            console.log('신청자 데이터 응답:', applicationsRes.data);

            displayParticipantManagement(participantsRes.data, applicationsRes.data, postId);
        } catch(e) {
            console.error('참여자 데이터 로드 실패:', e);
            console.error('에러 상세:', e.response?.data);
            
            let errorMessage = '참여자 데이터를 로드할 수 없습니다.';
            if (e.response?.status === 404) {
                errorMessage = '게시글을 찾을 수 없습니다.';
            } else if (e.response?.status === 500) {
                errorMessage = '서버 내부 오류가 발생했습니다.';
            } else if (e.response?.data?.message) {
                errorMessage = e.response.data.message;
            }
            
            document.getElementById('participant-management').innerHTML =
                `<div class="error-message">❌ ${errorMessage}</div>`;
        }
    }

    function displayParticipantManagement(participants, applications, postId) {
        const container = document.getElementById('participant-management');
        container.innerHTML = '';

        console.log('displayParticipantManagement 호출됨');
        console.log('participants:', participants);
        console.log('applications:', applications);
        console.log('postId:', postId);

        // 데이터 구조 확인 및 배열 변환
        let participantsArray = participants;
        let applicationsArray = applications;

        // participants 처리
        if (participants && !Array.isArray(participants)) {
            if (participants.data && Array.isArray(participants.data)) {
                participantsArray = participants.data;
            } else if (typeof participants === 'object') {
                participantsArray = [participants];
            } else {
                participantsArray = [];
            }
        }

        // applications 처리
        if (applications && !Array.isArray(applications)) {
            if (applications.data && Array.isArray(applications.data)) {
                applicationsArray = applications.data;
            } else if (typeof applications === 'object') {
                applicationsArray = [applications];
            } else {
                applicationsArray = [];
            }
        }

        console.log('처리된 participantsArray:', participantsArray);
        console.log('처리된 applicationsArray:', applicationsArray);

        // 승인된 참가자 목록
        const approvedParticipants = participantsArray || [];
        if (approvedParticipants.length > 0) {
            const participantsDiv = document.createElement('div');
            participantsDiv.innerHTML = '<h4>✅ 승인된 참가자</h4>';

            approvedParticipants.forEach(participant => {
                const div = document.createElement('div');
                div.className = 'participant-item';
                div.innerHTML = `
                    <p><strong>${participant.participantNickname || participant.userId || '사용자'}</strong></p>
                    <p>상태: ${participant.status || 'APPROVED'}</p>
                    <div class="action-buttons">
                        <button onclick="updateParticipantStatus(${postId}, ${participant.userId || participant.participantId}, 'REJECTED')" class="reject">
                            참여 취소
                        </button>
                    </div>
                `;
                participantsDiv.appendChild(div);
            });
            container.appendChild(participantsDiv);
        }

        // 대기 중인 신청자 목록
        const pendingApplications = applicationsArray ? applicationsArray.filter(app => app.status === 'PENDING') : [];
        if (pendingApplications.length > 0) {
            const applicationsDiv = document.createElement('div');
            applicationsDiv.innerHTML = '<h4>⏳ 대기 중인 신청자</h4>';

            pendingApplications.forEach(application => {
                const div = document.createElement('div');
                div.className = 'application-item';
                div.innerHTML = `
                    <p><strong>${application.participantNickname || application.userId || '사용자'}</strong></p>
                    <p>신청일: ${application.createdAt || application.requestedAt || 'N/A'}</p>
                    <div class="action-buttons">
                        <button onclick="updateParticipantStatus(${postId}, ${application.participantId || application.userId}, 'APPROVED')" class="approve">
                            승인
                        </button>
                        <button onclick="updateParticipantStatus(${postId}, ${application.participantId || application.userId}, 'REJECTED')" class="reject">
                            거절
                        </button>
                    </div>
                `;
                applicationsDiv.appendChild(div);
            });
            container.appendChild(applicationsDiv);
        }

        // 거절된 신청자 목록
        const rejectedApplications = applicationsArray ? applicationsArray.filter(app => app.status === 'REJECTED') : [];
        if (rejectedApplications.length > 0) {
            const rejectedDiv = document.createElement('div');
            rejectedDiv.innerHTML = '<h4>❌ 거절된 신청자</h4>';

            rejectedApplications.forEach(application => {
                const div = document.createElement('div');
                div.className = 'application-item';
                div.style.borderLeftColor = '#dc3545';
                div.innerHTML = `
                    <p><strong>${application.participantNickname || application.userId || '사용자'}</strong></p>
                    <p>신청일: ${application.createdAt || application.requestedAt || 'N/A'}</p>
                    <p>상태: ${application.status}</p>
                `;
                rejectedDiv.appendChild(div);
            });
            container.appendChild(rejectedDiv);
        }

        if (approvedParticipants.length === 0 && pendingApplications.length === 0 && rejectedApplications.length === 0) {
            container.innerHTML = '<div class="success-message">📝 참여자나 신청자가 없습니다.</div>';
        }
    }

    async function updateParticipantStatus(postId, userId, status) {
        if (!postId || !userId || userId === 'undefined') {
            alert('유효하지 않은 요청입니다. postId 또는 userId가 없습니다.');
            return;
        }

        try {
            const res = await axios.put(
                `/api/schedule/${postId}/participants/${userId}`,
                { status: status },
                { headers: getAuthHeaders() }
            );

            // 성공 시 UI 업데이트
            await loadParticipantData(postId);

            // 성공 메시지
            const statusText = status === 'APPROVED' ? '승인' : status === 'REJECTED' ? '거절' : '상태 변경';
            alert(`${statusText} 처리되었습니다.`);

            // 결과 로그
            document.getElementById('schedule-result').innerHTML = `
                <div class="success-message">
                    <h3>✅ 상태 변경 성공</h3>
                    <pre>${JSON.stringify(res.data, null, 2)}</pre>
                </div>
            `;
        } catch (error) {
            console.error('상태 변경 실패:', error);

            let errorMessage = '상태 변경에 실패했습니다.';
            if (error.response) {
                errorMessage = error.response.data.message || errorMessage;
            }

            document.getElementById('schedule-result').innerHTML = `
                <div class="error-message">
                    <h3>❌ 상태 변경 실패</h3>
                    <p>${errorMessage}</p>
                </div>
            `;

            alert(errorMessage);
        }
    }

    // ===== 공통 함수 =====
    function logout() {
        document.cookie = 'accessToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'refreshToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        alert('로그아웃되었습니다.');
        window.location.href = '/';
    }

    <!-- 웹 소켓 초기화 -->

    // 공통 알림 표시 함수 (유지)
    function showNotification(notification) {
        const notificationDiv = document.createElement('div');
        notificationDiv.className = 'notification';
        notificationDiv.innerHTML = `
        <strong>${notification.title || '새 알림'}</strong>
        <p>${notification.content}</p>
        <small>${new Date(notification.createdAt).toLocaleString()}</small>
    `;
        document.body.appendChild(notificationDiv);

        setTimeout(() => notificationDiv.remove(), 5000);
    }

    // 수정된 페이지 로드 함수
    window.onload = async function() {
        const accessToken = getCookie('accessToken');
        document.getElementById('login-status').textContent = accessToken ? '로그인됨' : '로그인 필요';

        if (accessToken) {
            try {
                await window.wsManager.connect(); // 공통 WebSocketManager 사용
                loadScheduleData();
            } catch (error) {
                console.error("웹소켓 연결 실패:", error);
            }
        }
    };

</script>
</body>
</html>
