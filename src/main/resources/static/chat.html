<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GotEEgo 채팅</title>
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/notification.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/shared-websocket.js"></script>
</head>
<body>
<div class="chat-container">
    <div class="sidebar">
        <div class="header">
            <h2>채팅</h2>
            <button onclick="logout()">로그아웃</button>
        </div>

        <div class="control-panel">
            <button onclick="toggleUserInfo()">내 정보</button>
            <button onclick="loadDirectChatRooms()">DM</button>
            <button onclick="loadGroupChatRooms()">그룹</button>
            <button onclick="loadAllUsers()">사용자 검색</button>
        </div>

        <div class="user-info-panel" id="user-info-panel">
            <pre id="user-result"></pre>
        </div>

        <div class="chat-list">
            <div id="direct-chat-room-list" class="chat-room-list"></div>
            <div id="group-chat-room-list" class="chat-room-list" style="display:none;"></div>
            <div id="all-users-list" class="chat-room-list" style="display:none;"></div>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <h2 id="current-chat-title">채팅방을 선택해주세요</h2>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input" id="chat-input-box" style="display:none;">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요" />
            <button onclick="sendMessage()">보내기</button>
        </div>
    </div>
</div>

<div class="notification-container" id="notificationContainer"></div>

<script>
    // 전역 변수
    let currentRoomId = null;
    let recipientId = null;
    let isGroupChat = false;
    let currentRoomTitle = "";

    // ===== 공통 유틸리티 함수 =====
    function getAuthHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + getCookie('accessToken')
        };
    }

    function getCookie(name) {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith(name + '=')) {
                return cookie.substring(name.length + 1);
            }
        }
        return null;
    }

    function appendMessage(msg) {
        const messagesDiv = document.getElementById('messages');
        const div = document.createElement('div');
        div.textContent = msg;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function logout() {
        if (window.wsManager && window.wsManager.stompClient.connected) {
            window.wsManager.disconnect();
        }
        localStorage.removeItem('wsSessionId');

        document.cookie = 'accessToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'refreshToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        alert('로그아웃되었습니다.');
        window.location.href = '/';
    }

    // ===== 사용자 정보 조회 =====
    async function getCurrentUser() {
        try {
            const res = await axios.get('/api/users/me', {headers: getAuthHeaders()});
            document.getElementById('user-result').textContent = JSON.stringify(res.data, null, 2);
        } catch(e) {
            document.getElementById('user-result').textContent = "정보 조회 실패: " + e;
        }
    }

    function toggleUserInfo() {
        const panel = document.getElementById('user-info-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';

        if (panel.style.display === 'block') {
            getCurrentUser();
        }
    }


    /**
     * ✅ [신규] 모든 사용자 목록을 불러오는 함수
     */
    async function loadAllUsers() {
        try {
            // 다른 목록은 숨김 처리
            document.getElementById('direct-chat-room-list').style.display = 'none';
            document.getElementById('group-chat-room-list').style.display = 'none';
            const container = document.getElementById('all-users-list');
            container.style.display = 'block';
            container.innerHTML = '<p>사용자 목록을 불러오는 중...</p>';

            // GET /api/users API 호출 (자신을 제외한 모든 유저)
            const res = await axios.get('/api/users', { headers: getAuthHeaders() });
            const users = res.data;
            container.innerHTML = '';

            if (users.length === 0) {
                container.innerHTML = '<p>다른 사용자가 없습니다.</p>';
                return;
            }

            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-list-item';
                div.innerHTML = `
                    <span>${user.email}</span>
                    <button onclick="startDirectChat(${user.id})">1:1 채팅</button>
                `;
                container.appendChild(div);
            });

        } catch (e) {
            console.error('전체 사용자 목록 조회 실패:', e);
            document.getElementById('all-users-list').innerHTML = '<p style="color:red">사용자 목록 조회에 실패했습니다.</p>';
        }
    }




    /**
     * ✅ [수정] 1:1 채팅 시작 함수 (백엔드 API에 맞게 수정)
     */
    async function startDirectChat(otherUserId) {
        try {
            // POST /api/chat/direct/{otherUserId} API 호출
            const res = await axios.post(
                `/api/chat/direct/${otherUserId}`,
                {},
                { headers: getAuthHeaders() }
            );

            const chatRoom = res.data;
            console.log('채팅방 생성/조회 결과:', chatRoom);

            // 채팅방으로 이동
            enterChatRoom(chatRoom.roomId, otherUserId, false);

            // DM 목록 새로고침
            loadDirectChatRooms();

        } catch(e) {
            console.error('1:1 채팅 시작 실패:', e);
            if (e.response) {
                console.error('응답 데이터:', e.response.data);
                console.error('상태 코드:', e.response.status);
                alert('1:1 채팅 시작에 실패했습니다: ' + (e.response.data.message || e.response.statusText));
            } else {
                alert('1:1 채팅 시작에 실패했습니다: ' + e.message);
            }
        }
    }

    // ===== 채팅방 관련 함수 =====
    async function loadDirectChatRooms() {
        try {
            document.getElementById('group-chat-room-list').style.display = 'none';
            document.getElementById('all-users-list').style.display = 'none';
            const container = document.getElementById('direct-chat-room-list');
            container.style.display = 'block';
            container.innerHTML = '<p>1:1 채팅방 목록을 불러오는 중...</p>';

            const res = await axios.get('/api/chat/my-rooms/direct', {headers: getAuthHeaders()});
            const rooms = res.data;
            container.innerHTML = '';

            if (rooms.length === 0) {
                container.innerHTML = '<p>1:1 채팅방이 없습니다.</p>';
                return;
            }

            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'chat-room-item';
                div.setAttribute('data-room-id', room.roomId);
                div.innerHTML = `
                    <p><strong>${room.otherUserNickname || '알 수 없는 사용자'}</strong></p>
                    <small>${room.otherUserEmail}</small>
                `;
                div.onclick = () => enterChatRoom(room.roomId, room.otherUserId, false);
                container.appendChild(div);
            });
        } catch(e) {
            console.error('1:1 채팅방 목록 조회 실패:', e);
            document.getElementById('direct-chat-room-list').innerHTML =
                '<p style="color:red">1:1 채팅방 목록 조회 실패</p>';
        }
    }

    async function loadGroupChatRooms() {
        try {
            document.getElementById('direct-chat-room-list').style.display = 'none';
            document.getElementById('all-users-list').style.display = 'none';
            const container = document.getElementById('group-chat-room-list');
            container.style.display = 'block';
            container.innerHTML = '<p>그룹 채팅방 목록을 불러오는 중...</p>';

            const res = await axios.get('/api/chat/my-rooms/group', {headers: getAuthHeaders()});
            const rooms = res.data;
            container.innerHTML = '';

            if (rooms.length === 0) {
                container.innerHTML = '<p>참여 중인 그룹 채팅방이 없습니다.</p>';
                return;
            }

            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'chat-room-item';
                div.setAttribute('data-room-id', room.roomId);
                div.innerHTML = `
                    <p><strong>${room.groupName || '그룹 채팅방'}</strong></p>
                    <small>참여자: ${room.participants.length}명</small>
                `;
                div.onclick = () => enterChatRoom(room.roomId, null, true);
                container.appendChild(div);
            });
        } catch(e) {
            console.error('그룹 채팅방 목록 조회 실패:', e);
            document.getElementById('group-chat-room-list').innerHTML =
                '<p style="color:red">그룹 채팅방 목록 조회 실패</p>';
        }
    }

    async function enterChatRoom(roomId, otherUserId, isGroup) {
        try {
            // 기존 활성화된 채팅방 비활성화
            document.querySelectorAll('.chat-room-item.active').forEach(item => {
                item.classList.remove('active');
            });

            // 현재 채팅방 활성화
            const roomItem = document.querySelector(`.chat-room-item[data-room-id="${roomId}"]`);
            if (roomItem) {
                roomItem.classList.add('active');
            }

            currentRoomId = roomId;
            recipientId = otherUserId;
            isGroupChat = isGroup;

            // 채팅창 제목 설정
            const roomTitle = roomItem ?
                roomItem.querySelector('p strong').textContent :
                (isGroup ? '그룹 채팅방' : '1:1 채팅방');
            document.getElementById('current-chat-title').textContent = roomTitle;

            // 메시지 영역 초기화
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';

            // 채팅 입력창 표시
            document.getElementById('chat-input-box').style.display = 'block';

            // 기존 메시지 로드
            const res = await axios.get(`/api/chat/rooms/${roomId}/messages`, {headers: getAuthHeaders()});
            res.data.forEach(msg => {
                appendMessage(`${msg.senderName}: ${msg.content}`);
            });

            // WebSocket 연결 및 구독
            await window.wsManager.connect();
            window.wsManager.cleanupChatSubscriptions();

            const callback = (message) => {
                const msg = JSON.parse(message.body);
                if (!isGroup || msg.roomId === roomId) {
                    appendMessage(`${msg.senderName}: ${msg.content}`);
                }
            };

            window.wsManager.subscribeChat(roomId, isGroup, callback);

        } catch(e) {
            console.error('채팅방 입장 실패:', e);
            alert('채팅방 연결 실패. 새로고침 해주세요.');
        }
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !currentRoomId) return;

        if (!window.wsManager.stompClient?.connected) {
            alert("연결 상태를 확인 중입니다. 잠시 후 다시 시도해주세요.");
            return;
        }

        const message = {
            roomId: currentRoomId,
            content: content,
            type: "TALK"
        };

        const { stompClient } = window.wsManager;
        if (!isGroupChat) {
            message.recipientId = recipientId;
            stompClient.send(`/pub/chat.direct.send/${currentRoomId}`, {}, JSON.stringify(message));
        } else {
            stompClient.send(`/pub/chat.group.send/${currentRoomId}`, {}, JSON.stringify(message));
        }

        input.value = '';
    }

    // ===== 초기화 함수 =====
    window.onload = async function() {
        const accessToken = getCookie('accessToken');
        if (!accessToken) {
            alert('로그인이 필요합니다.');
            window.location.href = '/';
            return;
        }

        try {
            await window.wsManager.connect();
            loadDirectChatRooms(); // 기본으로 1:1 채팅방 목록 로드
        } catch (error) {
            console.error("웹소켓 연결 실패:", error);
        }
    };

    // 페이지 언로드 시 채팅 구독 정리
    window.addEventListener('beforeunload', () => {
        if (window.wsManager) {
            window.wsManager.cleanupChatSubscriptions();
        }
    });
</script>
</body>
</html>
