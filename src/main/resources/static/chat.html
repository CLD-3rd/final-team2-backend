<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>GotEEgo 채팅</title>
    <link rel="stylesheet" href="/css/chat.css">
    <link rel="stylesheet" href="/css/notification.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/shared-websocket.js"></script>
    <script src="/js/common.js"></script>
    <style>
        .loader {
            padding: 10px;
            text-align: center;
            color: #666;
        }
        .chat-messages {
            overflow-y: auto;
            /* 화면 높이에 맞게 조절 */
            height: calc(100vh - 200px);
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: #f1f0f0;
            border-radius: 18px;
            max-width: 60%;
            word-wrap: break-word;
        }
        .message.sent {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
        }
        .message.received {
            align-self: flex-start;
            background-color: #e9e9eb;
        }
        .message-sender {
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .message-timestamp {
            font-size: 0.7em;
            color: #888;
            margin-left: 8px;
        }
        .no-messages {
            text-align: center;
            color: #999;
            padding: 20px;
            margin: auto;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="sidebar">
        <div class="header">
            <h2>채팅</h2>
            <button onclick="logout()">로그아웃</button>
        </div>

        <div class="control-panel">
            <button onclick="toggleUserInfo()">내 정보</button>
            <button onclick="loadDirectChatRooms()">DM</button>
            <button onclick="loadGroupChatRooms()">그룹</button>
            <button onclick="loadAllUsers()">사용자 검색</button>
        </div>

        <div class="user-info-panel" id="user-info-panel" style="display:none;">
            <pre id="user-result"></pre>
        </div>

        <div class="chat-list">
            <div id="direct-chat-room-list" class="chat-room-list"></div>
            <div id="group-chat-room-list" class="chat-room-list" style="display:none;"></div>
            <div id="all-users-list" class="chat-room-list" style="display:none;"></div>
        </div>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <h2 id="current-chat-title">채팅방을 선택해주세요</h2>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input" id="chat-input-box" style="display:none;">
            <input type="text" id="messageInput" placeholder="메시지를 입력하세요" onkeyup="if(event.keyCode===13) sendMessage()" />
            <button onclick="sendMessage()">보내기</button>
        </div>
    </div>
</div>

<div class="notification-container" id="notificationContainer"></div>

<script>
    // 전역 변수
    let currentUserId = null;
    let currentRoomId = null;
    let recipientId = null;
    let currentPage = 0;
    let hasMoreMessages = true;
    let isLoadingMessages = false;



    // 공통 유틸리티 함수
    function appendMessage(msg, isNew = true) {
        const messagesDiv = document.getElementById('messages');
        const noMsgDiv = messagesDiv.querySelector('.no-messages');
        if (noMsgDiv) noMsgDiv.remove();

        const div = document.createElement('div');
        const messageClass = msg.senderId === currentUserId ? 'sent' : 'received';
        div.className = `message ${messageClass}`;

        div.innerHTML = `
            ${msg.senderId !== currentUserId ? `<div class="message-sender">${msg.senderName}</div>` : ''}
            <span>${msg.content}</span>
            <span class="message-timestamp">${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        `;

        if (isNew) {
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } else {
            messagesDiv.insertBefore(div, messagesDiv.firstChild);
        }
    }


    // 사용자 정보 및 채팅방 목록 로드
    async function getCurrentUser() {
        try {
            const res = await apiClient.get('/api/users/me');
            currentUserId = res.data.id;
            document.getElementById('user-result').textContent = JSON.stringify(res.data, null, 2);
        } catch(e) {
            document.getElementById('user-result').textContent = "정보 조회 실패: " + e;
        }
    }

    function toggleUserInfo() {
        const panel = document.getElementById('user-info-panel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if (panel.style.display === 'block' && !currentUserId) {
            getCurrentUser();
        }
    }

    async function loadAllUsers() {
        try {
            document.getElementById('direct-chat-room-list').style.display = 'none';
            document.getElementById('group-chat-room-list').style.display = 'none';
            const container = document.getElementById('all-users-list');
            container.style.display = 'block';
            container.innerHTML = '<p>사용자 목록을 불러오는 중...</p>';

            const res = await apiClient.get('/api/users');
            const users = res.data.filter(user => user.id !== currentUserId); // 자기 자신은 제외
            container.innerHTML = '';

            if (users.length === 0) {
                container.innerHTML = '<p>다른 사용자가 없습니다.</p>';
                return;
            }

            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'chat-room-item';
                div.innerHTML = `
                    <p><strong>${user.nickname}</strong></p>
                    <small>${user.email}</small>
                `;
                div.onclick = () => startDirectChat(user.id);
                container.appendChild(div);
            });
        } catch (e) {
            console.error('전체 사용자 목록 조회 실패:', e);
            document.getElementById('all-users-list').innerHTML = '<p style="color:red">사용자 목록 조회에 실패했습니다.</p>';
        }
    }

    async function startDirectChat(otherUserId) {
        try {
            const res = await apiClient.post(`/api/chat/direct/${otherUserId}`);
            const chatRoom = res.data;
            await loadDirectChatRooms(); // 목록을 새로고침하여 새 채팅방을 포함
            enterChatRoom(chatRoom.roomId, otherUserId, false); // 새 채팅방으로 바로 입장
        } catch(e) {
            alert('1:1 채팅 시작에 실패했습니다: ' + (e.response?.data?.message || e.message));
        }
    }

    // 채팅방 입장 및 메시지 관리
    async function enterChatRoom(roomId, otherUserId, isGroup) {
        document.querySelectorAll('.chat-room-item.active').forEach(item => item.classList.remove('active'));
        const roomItem = document.querySelector(`.chat-room-item[data-room-id="${roomId}"]`);
        if (roomItem) roomItem.classList.add('active');

        currentRoomId = roomId;
        recipientId = isGroup ? null : otherUserId;
        currentPage = 0;
        hasMoreMessages = true;
        isLoadingMessages = false;

        const roomTitle = roomItem ? roomItem.querySelector('p strong').textContent : (isGroup ? '그룹 채팅방' : '1:1 채팅방');
        document.getElementById('current-chat-title').textContent = roomTitle;
        document.getElementById('chat-input-box').style.display = 'flex';

        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = '<div class="loader">이전 메시지를 불러오는 중...</div>';
        messagesDiv.removeEventListener('scroll', handleScroll);

        try {
            const res = await apiClient.get(`/api/chat/rooms/${roomId}/messages`, {
                params: { page: 0, size: 20, sort: 'timestamp,desc' }
            });
            messagesDiv.innerHTML = '';
            const messages = res.data.content || [];

            if (messages.length === 0) {
                messagesDiv.innerHTML = '<p class="no-messages">대화를 시작해보세요!</p>';
                hasMoreMessages = false;
            } else {
                messages.reverse().forEach(msg => appendMessage(msg, true));
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                messagesDiv.addEventListener('scroll', handleScroll);
            }
        } catch(e) {
            messagesDiv.innerHTML = '<p class="no-messages" style="color:red;">메시지를 불러오지 못했습니다.</p>';
        }

        // ⭐ 구독 로직 수정: 그룹 채팅일 경우에만 구독/해제 관리
        if (isGroup) {
            window.wsManager.subscribeGroupChat(roomId, (msg) => {
                appendMessage(msg, true);
            });
        } else {
            // 1:1 채팅은 이미 전역으로 구독 중이므로, 여기서는 다른 방의 구독만 해제
            window.wsManager.cleanupGroupChatSubscription();
        }
    }

    async function loadMoreMessages() {
        if (!hasMoreMessages || isLoadingMessages) return;

        isLoadingMessages = true;
        const messagesDiv = document.getElementById('messages');
        const prevScrollHeight = messagesDiv.scrollHeight;

        const loader = document.createElement('div');
        loader.className = 'loader';
        loader.textContent = '메시지 불러오는 중...';
        messagesDiv.insertBefore(loader, messagesDiv.firstChild);

        try {
            const res = await apiClient.get(`/api/chat/rooms/${currentRoomId}/messages`, {
                params: { page: currentPage + 1, size: 20, sort: 'timestamp,desc' }
            });

            const messageSlice = res.data;
            const messages = messageSlice.content;

            loader.remove();

            if (messages.length === 0) {
                hasMoreMessages = false;
                return;
            }

            messages.reverse().forEach(msg => appendMessage(msg, false));
            messagesDiv.scrollTop = messagesDiv.scrollHeight - prevScrollHeight;
            currentPage++;

        } catch (e) {
            console.error('메시지 로드 실패:', e);
            loader.textContent = '로드 실패';
        } finally {
            isLoadingMessages = false;
        }
    }

    function handleScroll() {
        const messagesDiv = document.getElementById('messages');
        if (messagesDiv.scrollTop === 0 && hasMoreMessages && !isLoadingMessages) {
            loadMoreMessages();
        }
    }

    async function loadDirectChatRooms() {
        document.getElementById('group-chat-room-list').style.display = 'none';
        document.getElementById('all-users-list').style.display = 'none';
        const container = document.getElementById('direct-chat-room-list');
        container.style.display = 'block';
        container.innerHTML = '<p>1:1 채팅방 목록을 불러오는 중...</p>';
        try {
            const res = await apiClient.get('/api/chat/my-rooms/direct');
            const rooms = res.data;
            container.innerHTML = '';

            if (rooms.length === 0) {
                container.innerHTML = '<p>1:1 채팅방이 없습니다.</p>';
                return;
            }
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'chat-room-item';
                div.setAttribute('data-room-id', room.roomId);
                div.innerHTML = `
                    <p><strong>${room.otherUserNickname || '알 수 없는 사용자'}</strong></p>
                    <small>${room.otherUserEmail}</small>
                `;
                div.onclick = () => enterChatRoom(room.roomId, room.otherUserId, false);
                container.appendChild(div);
            });
        } catch(e) {
            container.innerHTML = '<p style="color:red">1:1 채팅방 목록 조회 실패</p>';
        }
    }

    async function loadGroupChatRooms() {
        document.getElementById('direct-chat-room-list').style.display = 'none';
        document.getElementById('all-users-list').style.display = 'none';
        const container = document.getElementById('group-chat-room-list');
        container.style.display = 'block';
        container.innerHTML = '<p>그룹 채팅방 목록을 불러오는 중...</p>';
        try {
            const res = await apiClient.get('/api/chat/my-rooms/group');
            const rooms = res.data;
            container.innerHTML = '';
            if (rooms.length === 0) {
                container.innerHTML = '<p>참여 중인 그룹 채팅방이 없습니다.</p>';
                return;
            }
            rooms.forEach(room => {
                const div = document.createElement('div');
                div.className = 'chat-room-item';
                div.setAttribute('data-room-id', room.roomId);
                div.innerHTML = `
                    <p><strong>${room.groupName || '그룹 채팅방'}</strong></p>
                    <small>참여자: ${room.participantCount}명</small>
                `;
                div.onclick = () => enterChatRoom(room.roomId, null, true);
                container.appendChild(div);
            });
        } catch(e) {
            container.innerHTML = '<p style="color:red">그룹 채팅방 목록 조회 실패</p>';
        }
    }

    // 메시지 전송
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content || !currentRoomId) return;

        if (!window.wsManager.stompClient?.connected) {
            alert("연결 상태를 확인 중입니다. 잠시 후 다시 시도해주세요.");
            return;
        }

        const { stompClient } = window.wsManager;

        if (recipientId) { // 1:1 채팅 (recipientId가 있을 때)
            const message = { content, type: "TALK", recipientId };
            stompClient.send(`/pub/chat.direct.send/${currentRoomId}`, {}, JSON.stringify(message));
        } else { // 그룹 채팅
            const message = { content, type: "TALK" };
            stompClient.send(`/pub/chat.group.send/${currentRoomId}`, {}, JSON.stringify(message));
        }
        input.value = '';
        input.focus();
    }


    // ⭐ 페이지 초기화 함수
    window.onload = async function() {
        try {
            await getCurrentUser(); // 내 정보를 먼저 가져와 currentUserId를 설정
            await window.wsManager.connect();
            console.log("전역 웹소켓 및 개인 큐 구독 완료!");

            // 1:1 메시지를 받았을 때 처리할 동작을 전역 콜백으로 등록
            window.wsManager.onDirectMessageReceived = (msg) => {
                console.log("수신한 1:1 메시지:", msg);
                // 현재 보고 있는 채팅방의 메시지일 경우에만 화면에 추가
                if (msg.roomId === currentRoomId) {
                    appendMessage(msg, true);
                } else {
                    // 다른 채팅방의 메시지일 경우 알림 처리
                    console.log(`다른 방(${msg.roomId})에서 온 메시지. UI 업데이트 필요.`);
                    const roomItem = document.querySelector(`.chat-room-item[data-room-id="${msg.roomId}"]`);
                    if(roomItem && !roomItem.querySelector('.notification-badge')) {
                        const badge = document.createElement('span');
                        badge.className = 'notification-badge';
                        badge.textContent = 'N';
                        roomItem.appendChild(badge);
                    }
                }
            };

            // 기본 채팅방 목록 로드
            loadDirectChatRooms();

        } catch (error) {
            console.error("초기 연결 및 설정 실패:", error);
            alert('서버와 연결에 실패했습니다. 새로고침 해주세요.');
        }
    };

    window.addEventListener('beforeunload', () => {
        if (window.wsManager) {
            window.wsManager.disconnect();
        }
    });
</script>
</body>
</html>
