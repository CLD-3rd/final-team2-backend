plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Lombok 설정
configurations.all {
    resolutionStrategy {
        force 'org.projectlombok:lombok:1.18.30'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    /** 🌐 Spring Boot 기본 스타터 **/
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /** 🧩 WebSocket & Messaging **/
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-messaging'

    /** 🛢 Database **/
    runtimeOnly 'com.mysql:mysql-connector-j'
    // PostgreSQL + pgvector (추천 시스템용)
    // runtimeOnly 'org.postgresql:postgresql'
    // pgvector extension for PostgreSQL
    // PostgreSQL에 pgvector 확장이 설치되어 있어야 함
    // 실제로는 PostgreSQL 확장으로 처리하므로 별도 Java 라이브러리 불필요
    implementation 'com.pgvector:pgvector:0.1.3'

    /** 🏗 Redis / MongoDB **/
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    /** 🔐 OAuth2 & JWT **/
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /** ☁ AWS S3 **/
    implementation 'software.amazon.awssdk:s3:2.20.120'

    /** 🛠 개발 편의 **/
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    /** ✅ 테스트 **/
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    enabled = false  // 테스트 비활성화
}
