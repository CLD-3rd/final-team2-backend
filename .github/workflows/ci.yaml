name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: # 🚀 수동 실행 트리거
    inputs:
      deploy_branch:
        description: '배포할 manifest의 브랜치 (예: dev, main)'
        required: true
        default: 'dev'

jobs:
  ci:
    runs-on: ubuntu-latest

    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}

    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🧾 Make application-env.yml
        run: |
          mkdir -p ./src/main/resources
          touch ./src/main/resources/application-env.yml
          echo "${{ secrets.APPLICATION_ENV_YML }}" > ./src/main/resources/application-env.yml
        shell: bash

      - name: 🏗️ Build with Gradle
        run: ./gradlew build -x test --no-daemon --build-cache --parallel --configure-on-demand

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set SHORT_SHA env
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: Export SHORT_SHA to output
        id: set_sha
        run: echo "short_sha=${{ env.SHORT_SHA }}" >> $GITHUB_OUTPUT

  cd:
    runs-on: ubuntu-latest
    needs: ci

    env:
      SHORT_SHA: ${{ needs.ci.outputs.short_sha }}
      DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch }}

    steps:
      - name: Clone final-team2-manifest repository
        uses: actions/checkout@v4
        with:
          repository: CLD-3rd/final-team2-manifest
          token: ${{ secrets.CI_PUSH_PAT }}
          path: final-team2-manifest
          ref: ${{ env.DEPLOY_BRANCH }}

      # [1] dev 브랜치 사용 시
      - name: Update image tag in manifests
        run: |
          sed -i "s|image: .*/.*:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}:${{ env.SHORT_SHA }}|" \
            final-team2-manifest/overlays/dev/applications/backend-api.yaml

      - name: Commit and push updated manifest
        run: |
          cd final-team2-manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlays/dev/applications/backend-api.yaml
          git commit -m "Update image tag to ${{ env.SHORT_SHA }}"
          git push origin ${{ env.DEPLOY_BRANCH }}


      # [2] refactor/manifest 브랜치 사용 시
